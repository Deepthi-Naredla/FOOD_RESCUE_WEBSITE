<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - History</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f6;
            color: #333;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header button {
            background: white;
            color: #198754;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            color: #198754;
        }

        .back {
            background: #198754;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        .history-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .history-card h3 {
            color: #198754;
            margin-bottom: 10px;
        }

        .history-card p {
            margin: 7px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e9f7ef;
            color: #198754;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 6px;
        }

    </style>

</head>


<body>


<header>

    <h1>FoodRescue</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div class="container">


    <div class="top">

        <h2>
            FoodRescue History
        </h2>

        <a
            href="dashboard.html"
            class="back">
            Dashboard
        </a>

    </div>


    <div id="historyContainer">

        <div class="empty">
            Loading history...
        </div>

    </div>


</div>


<script>


const token =
    localStorage.getItem("token");

const storedUser =
    localStorage.getItem("user");


if (!token || !storedUser) {

    window.location.href =
        "login.html";

}


const user =
    JSON.parse(storedUser);


let roles =
    user.roles || [];


if (
    roles.length === 0 &&
    user.role
) {

    roles = [
        user.role
    ];

}


const container =
    document.getElementById(
        "historyContainer"
    );


// ======================================================
// LOAD DONOR HISTORY
// ======================================================

async function loadDonorHistory() {

    const response =
        await fetch(
            "http://localhost:5000/api/donations/my",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Could not load donor history"
        );

    }


    return await response.json();

}


// ======================================================
// LOAD RECEIVER HISTORY
// ======================================================

async function loadReceiverHistory() {

    const response =
        await fetch(
            "http://localhost:5000/api/donations/accepted",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "Could not load receiver history"
        );

    }


    return await response.json();

}


// ======================================================
// DISPLAY HISTORY
// ======================================================

async function loadHistory() {

    try {

        let allHistory = [];


        // Donor history

        if (
            roles.includes("donor")
        ) {

            const donations =
                await loadDonorHistory();


            donations.forEach(
                donation => {

                    allHistory.push({

                        ...donation,

                        historyType:
                            "Donation Posted"

                    });

                }
            );

        }


        // Receiver history

        if (
            roles.includes("receiver")
        ) {

            const accepted =
                await loadReceiverHistory();


            accepted.forEach(
                donation => {

                    allHistory.push({

                        ...donation,

                        historyType:
                            "Donation Received"

                    });

                }
            );

        }


        // Remove duplicates

        const uniqueHistory =
            Array.from(
                new Map(
                    allHistory.map(
                        item => [
                            item._id +
                            item.historyType,
                            item
                        ]
                    )
                ).values()
            );


        if (
            uniqueHistory.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        No History Yet
                    </h3>

                    <p>
                        Your FoodRescue activities
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        uniqueHistory.forEach(
            donation => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "history-card";


                const date =
                    donation.createdAt
                    ? new Date(
                        donation.createdAt
                    ).toLocaleString()
                    : "-";


                card.innerHTML = `

                    <h3>
                        ${donation.foodName || "Food Donation"}
                    </h3>

                    <p>
                        <strong>Activity:</strong>
                        ${donation.historyType}
                    </p>

                    <p>
                        <strong>Food Type:</strong>
                        ${donation.foodType || "-"}
                    </p>

                    <p>
                        <strong>Quantity:</strong>
                        ${donation.quantity || 0}
                    </p>

                    <p>
                        <strong>Area:</strong>
                        ${donation.area || "-"}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${date}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status">
                            ${donation.status || "-"}
                        </span>
                    </p>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ${error.message}

            </div>

        `;

    }

}


// ======================================================
// LOGOUT
// ======================================================

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href =
        "login.html";

}


// ======================================================
// START
// ======================================================

loadHistory();


</script>


</body>

</html>
