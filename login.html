<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7f6;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #198754;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        FoodRescue
    </h1>

    <p class="subtitle">
        Login to your account
    </p>


    <form id="loginForm">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Login failed"
                );

            }


            // Save login information

            localStorage.setItem(
                "token",
                result.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(result.user)
            );


            // Get roles

            let roles =
                result.user.roles || [];


            // Support old accounts

            if (
                roles.length === 0 &&
                result.user.role
            ) {

                roles = [
                    result.user.role
                ];

            }


            message.textContent =
                "Login successful!";

            message.className =
                "message success";

            message.style.display =
                "block";


            // Admin goes to Admin Dashboard

            if (
                roles.includes("admin")
            ) {

                setTimeout(() => {

                    window.location.href =
    "http://127.0.0.1:5500/frontend/admin-dashboard.html";

                }, 500);

            }

            else {

                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 500);

            }

        }


        catch (error) {

            message.textContent =
                error.message;

            message.className =
                "message error";

            message.style.display =
                "block";

        }

    }
);

</script>


</body>

</html>
