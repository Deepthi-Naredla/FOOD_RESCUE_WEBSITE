
<!DOCTYPE html>
<html>
<head>
    <title>FoodRescue - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
        }

        .header {
            background: #2e7d32;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .home-btn {
            background: white;
            color: #2e7d32;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-box {
            background: white;
            width: 450px;
            max-width: 100%;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.10);
        }

        .register-box h2 {
            text-align: center;
            color: #2e7d32;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .role-box {
            margin-top: 10px;
        }

        .role-option {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .role-option:hover {
            background: #f1f8f2;
        }

        .role-option input {
            width: auto;
            margin-right: 10px;
        }

        .role-option label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .volunteer-payment {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f1f8f2;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
        }

        .volunteer-payment h3 {
            color: #2e7d32;
            margin-top: 0;
        }

        .hint {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }

        #qrPreview {
            display: none;
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-top: 12px;
            border: 1px solid #ccc;
            background: white;
            padding: 5px;
        }

        .register-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1b5e20;
        }

        .register-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">
        <div class="logo">
            🍃 FoodRescue
        </div>

        <button class="home-btn" onclick="goHome()">
            Home
        </button>
    </div>

    <!-- REGISTER -->

    <div class="container">

        <div class="register-box">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join FoodRescue and help reduce food waste
            </p>

            <form id="registerForm">

                <!-- NAME -->

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <!-- EMAIL -->

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- PASSWORD -->

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <!-- PHONE -->

                <label>Phone</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                >

                <!-- ROLES -->

                <label>Select your roles</label>

                <div class="role-box">

                    <div class="role-option">
                        <input
                            type="checkbox"
                            id="donor"
                            value="donor"
                            checked
                        >

                        <label for="donor">
                            🍱 Donor
                            <br>
                            <small>I want to donate surplus food</small>
                        </label>
                    </div>

                    <div class="role-option">
                        <input
                            type="checkbox"
                            id="receiver"
                            value="receiver"
                        >

                        <label for="receiver">
                            🤝 Receiver
                            <br>
                            <small>I want to receive surplus food</small>
                        </label>
                    </div>

                    <div class="role-option">
                        <input
                            type="checkbox"
                            id="volunteer"
                            value="volunteer"
                        >

                        <label for="volunteer">
                            🚗 Volunteer
                            <br>
                            <small>I want to help with pickup and delivery</small>
                        </label>
                    </div>

                </div>

                <!-- VOLUNTEER PAYMENT DETAILS -->

                <div class="volunteer-payment" id="volunteerPayment">

                    <h3>Volunteer Payment Details</h3>

                    <label>UPI ID</label>

                    <input
                        type="text"
                        id="upiId"
                        placeholder="Example: name@oksbi"
                    >

                    <label>Upload Your UPI QR Code</label>

                    <input
                        type="file"
                        id="qrCode"
                        accept="image/png,image/jpeg,image/jpg,image/webp"
                    >

                    <p class="hint">
                        Upload your personal UPI payment QR code.
                        Maximum image size: 1 MB.
                    </p>

                    <img id="qrPreview" alt="QR Code Preview">

                </div>

                <!-- AREA -->

                <label>Area</label>

                <input
                    type="text"
                    id="area"
                    placeholder="Example: Hanamkonda"
                >

                <!-- CAPACITY -->

                <label>Receiving Capacity</label>

                <input
                    type="number"
                    id="capacity"
                    value="0"
                    min="0"
                    placeholder="Example: 100"
                >

                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Sign In</a>
            </div>

        </div>

    </div>

    <script>

        // ==========================================
        // SHOW/HIDE VOLUNTEER PAYMENT FIELDS
        // ==========================================

        const volunteerCheckbox =
            document.getElementById("volunteer");

        const volunteerPayment =
            document.getElementById("volunteerPayment");

        const upiInput =
            document.getElementById("upiId");

        const qrInput =
            document.getElementById("qrCode");

        volunteerCheckbox.addEventListener("change", function () {

            volunteerPayment.style.display =
                this.checked ? "block" : "none";

            upiInput.required = this.checked;
            qrInput.required = this.checked;

        });


        // ==========================================
        // QR CODE PREVIEW
        // ==========================================

        qrInput.addEventListener("change", function () {

            const file = this.files[0];

            const preview =
                document.getElementById("qrPreview");

            preview.style.display = "none";

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                alert("Please select an image file.");
                this.value = "";
                return;
            }

            if (file.size > 1024 * 1024) {
                alert("QR image must be smaller than 1 MB.");
                this.value = "";
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {
                preview.src = event.target.result;
                preview.style.display = "block";
            };

            reader.readAsDataURL(file);

        });


        // ==========================================
        // REGISTER
        // ==========================================

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const message =
                    document.getElementById("message");

                const registerButton =
                    document.getElementById("registerButton");

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const phone =
                    document.getElementById("phone").value.trim();

                const area =
                    document.getElementById("area").value.trim();

                const capacity =
                    Number(document.getElementById("capacity").value);

                // Get selected roles

                const roles = [];

                if (document.getElementById("donor").checked) {
                    roles.push("donor");
                }

                if (document.getElementById("receiver").checked) {
                    roles.push("receiver");
                }

                if (volunteerCheckbox.checked) {
                    roles.push("volunteer");
                }

                // Check role selection

                if (roles.length === 0) {
                    message.innerText =
                        "Please select at least one role.";
                    message.style.color = "#c62828";
                    return;
                }

                // Volunteer payment details

                let upiId = "";
                let qrCode = "";

                if (volunteerCheckbox.checked) {

                    upiId = upiInput.value.trim();

                    const qrFile = qrInput.files[0];

                    if (!upiId || !qrFile) {
                        message.innerText =
                            "Please enter your UPI ID and upload your QR code.";
                        message.style.color = "#c62828";
                        return;
                    }

                    if (qrFile.size > 1024 * 1024) {
                        message.innerText =
                            "QR image must be smaller than 1 MB.";
                        message.style.color = "#c62828";
                        return;
                    }

                    try {

                        qrCode = await new Promise((resolve, reject) => {

                            const reader = new FileReader();

                            reader.onload = () => resolve(reader.result);

                            reader.onerror = () => reject(
                                new Error("Could not read QR image.")
                            );

                            reader.readAsDataURL(qrFile);

                        });

                    } catch (error) {

                        message.innerText = error.message;
                        message.style.color = "#c62828";
                        return;

                    }

                }

                message.innerText = "Creating account...";
                message.style.color = "#2e7d32";

                registerButton.disabled = true;

                try {

                    const response = await fetch(
                        "http://localhost:5000/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                name: name,
                                email: email,
                                password: password,
                                phone: phone,
                                roles: roles,
                                area: area,
                                capacity: capacity,

                                upiId: upiId,
                                qrCode: qrCode

                            })
                        }
                    );

                    const result = await response.json();

                    if (response.ok) {

                        message.innerText =
                            "✅ Account created successfully! Redirecting to login...";

                        message.style.color = "#2e7d32";

                        setTimeout(function () {
                            window.location.href = "login.html";
                        }, 1500);

                    } else {

                        message.innerText =
                            "❌ " + (result.message || "Registration failed");

                        message.style.color = "#c62828";

                        registerButton.disabled = false;

                    }

                } catch (error) {

                    console.error(error);

                    message.innerText =
                        "❌ Cannot connect to server.";

                    message.style.color = "#c62828";

                    registerButton.disabled = false;

                }

            });


        // ==========================================
        // HOME
        // ==========================================

        function goHome() {
            window.location.href = "index.html";
        }

    </script>

</body>
</html>
