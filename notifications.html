<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FoodRescue - Notifications</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f6;
            color: #333;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header button {
            background: white;
            color: #198754;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            color: #198754;
        }

        .back {
            background: #198754;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        .notification {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .notification h3 {
            color: #198754;
            margin-bottom: 10px;
        }

        .notification p {
            margin: 7px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e9f7ef;
            color: #198754;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 6px;
        }

        .accept-btn {
            margin-top: 15px;
            background: #198754;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .accept-btn:hover {
            background: #157347;
        }

    </style>

</head>


<body>


<header>

    <h1>
        🌿 FoodRescue
    </h1>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div class="container">


    <div class="top">

        <h2>
            📢 Notifications
        </h2>

        <a
            href="dashboard.html"
            class="back">

            Dashboard

        </a>

    </div>


    <div id="notificationContainer">

        <div class="empty">

            Loading notifications...

        </div>

    </div>


</div>


<script>


// ======================================================
// LOGIN CHECK
// ======================================================

const token =
    localStorage.getItem("token");

const storedUser =
    localStorage.getItem("user");


if (!token || !storedUser) {

    window.location.href =
        "login.html";

}


const user =
    JSON.parse(storedUser);


let roles =
    user.roles || [];


if (
    roles.length === 0 &&
    user.role
) {

    roles = [
        user.role
    ];

}


const container =
    document.getElementById(
        "notificationContainer"
    );


// ======================================================
// LOAD NOTIFICATIONS
// ======================================================

async function loadNotifications() {

    try {

        /*
         * At this stage we use available donations
         * as the receiver's notification source.
         *
         * Later we will add the full
         * Nearest Neighbor notification system.
         */

        if (!roles.includes("receiver")) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Receiver role required
                    </h3>

                    <p>
                        Add the Receiver role to
                        receive food notifications.
                    </p>

                </div>

            `;

            return;

        }


        const response =
            await fetch(
                "http://localhost:5000/api/donations/available",
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const donations =
            await response.json();


        if (!response.ok) {

            throw new Error(
                donations.message ||
                "Failed to load notifications"
            );

        }


        if (
            donations.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        No New Notifications
                    </h3>

                    <p>
                        New suitable food donations
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        donations.forEach(
            donation => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "notification";


                const date =
                    donation.createdAt
                    ? new Date(
                        donation.createdAt
                    ).toLocaleString()
                    : "-";


                card.innerHTML = `

                    <h3>
                        🍱 New Food Donation
                    </h3>

                    <p>
                        <strong>Food:</strong>
                        ${donation.foodName || "-"}
                    </p>

                    <p>
                        <strong>Type:</strong>
                        ${donation.foodType || "-"}
                    </p>

                    <p>
                        <strong>Quantity:</strong>
                        ${donation.quantity || 0}
                    </p>

                    <p>
                        <strong>Area:</strong>
                        ${donation.area || "-"}
                    </p>

                    <p>
                        <strong>Posted:</strong>
                        ${date}
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span class="status">
                            ${donation.status}
                        </span>

                    </p>

                    <button
                        class="accept-btn"
                        onclick="acceptDonation('${donation._id}')">

                        Accept Donation

                    </button>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ${error.message}

            </div>

        `;

    }

}


// ======================================================
// ACCEPT DONATION
// ======================================================

async function acceptDonation(
    donationId
) {

    try {

        const response =
            await fetch(
                `http://localhost:5000/api/donations/${donationId}/accept`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Could not accept donation"
            );

        }


        alert(
            "Donation accepted successfully!"
        );


        loadNotifications();

    }

    catch (error) {

        alert(
            error.message
        );

    }

}


// ======================================================
// LOGOUT
// ======================================================

function logout() {

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "login.html";

}


// ======================================================
// START
// ======================================================

loadNotifications();


</script>


</body>

</html>
